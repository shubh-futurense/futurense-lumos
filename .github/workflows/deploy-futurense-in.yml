# Publishes the futurense.in ad site (IIT Jodhpur B.S/B.Sc book-a-call page and
# its thank-you page) to the company Cloudflare account on every push to main.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, a Cloudflare token made
# from the "Edit Cloudflare Workers" template, limited to the Futurense
# Technologies account. Until that secret exists, this workflow skips itself.
name: Deploy futurense.in to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: futurense-in
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Futurense Technologies (company account). Not a secret.
      CLOUDFLARE_ACCOUNT_ID: f10785ecb337e32368bb5673b93edcc2
    steps:
      - name: Skip until the Cloudflare token is added
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret is not set yet, skipping."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build:landing
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
