# Downloads the Webflow images and fonts the site uses (npm run assets) and pushes them to the
# "assets-cache" branch, for development environments that cannot reach the Webflow CDN themselves.
name: Fetch assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets
      - name: Push to the assets-cache branch
        run: |
          cp -r src/assets /tmp/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan assets-cache
          git rm -rfq .
          cp -r /tmp/assets/cdn /tmp/assets/fonts .
          git add -A cdn fonts
          git commit -qm "Webflow assets"
          git push -f origin assets-cache
