# Downloads the Webflow images and fonts the site uses (npm run assets) and saves them as an
# artifact, for development environments that cannot reach the Webflow CDN themselves.
name: Fetch assets
on:
  workflow_dispatch:
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: src/assets/
          retention-days: 3
